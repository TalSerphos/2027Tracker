# Netlify deploy config. Connect the repo in the Netlify UI once; every push
# to the deployment branch then builds and publishes automatically.
#
# Set the crowd-vote env vars under Site settings → Environment variables:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# (the site still works without them — it falls back to a local-only vote).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA-style fallback (the app is a single page).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
