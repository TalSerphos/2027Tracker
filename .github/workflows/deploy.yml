name: Deploy to GitHub Pages

# GitHub Pages deploys from the repository's DEFAULT branch only (that's what
# the github-pages environment allows). The default branch is currently
# `claude/ai-2027-timeline-tracker-ujqh4e`, so only that branch triggers a
# deploy here. If you later set `main` as the default branch in Settings →
# Branches, add it below.
on:
  push:
    branches:
      - claude/ai-2027-timeline-tracker-ujqh4e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Provide these as repo secrets to enable the crowd-averaged vote.
          # Without them the site falls back to a local-only vote.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
